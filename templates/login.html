{% extends "base.html" %}
{% block title %}{{ t.login }}{% endblock %}
{% block content %}
  <section class="card ticket pop pop-3">
    <h1>{{ t.login }}</h1>
    <p class="muted">{{ t.login_hint }}</p>
    {% if error %}<p class="error" role="alert">{{ t.login_error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login', lang=g.lang, next=request.args.get('next')) }}">
      <label for="password">{{ t.password }}</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">{{ t.sign_in }}</button>
    </form>
  </section>
{% endblock %}
